# 开发期监控端点配置(无敏感数据, 排障友好; prod 收紧版本见 application-prod.yml)
management:
  endpoints:
    web:
      exposure:
        include: >
          health,info,httpexchanges,
          metrics,loggers,threaddump,
          beans,mappings,scheduledtasks,
          caches,conditions,startup
  endpoint:
    health:
      show-details: always
spring:
  datasource:
    # Postgresql连接
    driver-class-name: org.postgresql.Driver
    # 数据库主机名 postgresql, 由本机 hosts 映射到 192.168.188.1
    url: jdbc:postgresql://postgresql:5432/daxpay-dev?autoReconnect=true&reWriteBatchedInserts=true
    username: bootx
    password: bootx123
    hikari:
      minimumIdle: 5 # 最小连接数
      maximumPoolSize: 50 # 最大连接数
      leak-detection-threshold: 5000 # 检测连接泄漏的时间阈值（毫秒）
      connection-timeout: 30000 # 获取连接超时时间（毫秒）
      idle-timeout: 600000      # 空闲连接超时时间（毫秒）
      max-lifetime: 1800000     # 连接最大存活时间（毫秒）
  data:
    redis:
      # 主机名 redis, 由本机 hosts 映射到 192.168.188.1
      host: redis
      port: 6379
      database: 0
      password: bootx123
      lettuce:
        pool:
          max-wait: 1000ms
  # Artemis 消息队列（native 模式：连接外部独立 broker 容器，不再支持内嵌模式）
  artemis:
    mode: native
    # Broker 连接地址
    # 主机名 mq, 由本机 hosts 映射到 192.168.188.1
    broker-url: tcp://mq:61616
    # broker 账号（与容器启动环境变量一致）
    user: admin
    password: admin
    pool:
      enabled: true
      max-connections: 10
      idle-timeout: 30s
  jms:
    # 会话缓存，提升发送性能
    cache:
      enabled: true
      session-cache-size: 10
    # 默认 pub-sub-domain=false（点对点 queue）；
    # 缓存失效广播等 Topic 场景由独立的 cacheTopicListenerFactory 设置 true
    pub-sub-domain: false
    listener:
      auto-startup: true
# 开发时显示debug日志
logging:
  level:
    cn.daxpay.open.**: debug
# 接口文档配置
springdoc:
  # 默认展开对象类型的属性, 主要用在get类型的参数中
  default-flat-param-object: true
  # 是否开启API文档接口
  api-docs:
    enabled: true
# 基础脚手架配置
daxpay:
  platform:
    common:
      # 错误信息配置
      exception:
        show-full-message: true
      # swagger相关配置
      swagger:
        author: DaxPay
        title: DaxPay支付平台-开源版
        description: DaxPay支付平台-开源版
        version: 4.0.0-beta3
    starter:
      auth:
        # 开启超级管理员
        enable-admin: true
        # 用户管理列表中是否显示超级管理员用户
        admin-in-list: true
        ignore-urls:
          - '/actuator/**'
          - '/v3/api-docs/**'
          - '/swagger-ui/*'
          - '/swagger-resources/**'
          - '/token/**'
          - '/ws/**'
          - '/demo/**'
          - '/test/**'
          - '/error'
          - '/favicon.ico'
      # 审计日志配置
      audit-log:
        ip2region:
          # IPv4 xdb 文件路径
          file-path: D:/data/ip2region/ip2region_v4.xdb
          # IPv6 xdb 文件路径（可选, 未配置时 IPv6 查询返回 null）
          ipv6-file-path: D:/data/ip2region/ip2region_v6.xdb
          # IPv4 数据版本: OPEN_SOURCE(开源5段) | BASE(商业基础版) | HIGH(高级版) | PRO(专业版)
          data-version: open_source
          # IPv6 数据版本（可与 v4 不同）
          ipv6-data-version: open_source
          # 查询模式: VECTOR_INDEX(推荐) 或 CACHE
          search-type: VECTOR_INDEX
    config:
      # 交易定时同步开关(dev 环境开启)
      trade-sync-enabled: true
