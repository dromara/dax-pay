        # 密钥列表(支持密钥轮换, 列表内版本号不可重复)
        # 第一个为当前密钥(用于加密新数据), 其余为历史密钥(仅用于解密旧数据)
        # 密文格式: v{版本号}:{base64(IV + AES-GCM 密文)}, 解密时按版本前缀匹配对应密钥
        keys:
          # 32 位 AES 密钥(必须正好 32 个字符); 轮换时生成新密钥置于列表首位并使用更大的版本号
