    one:
      base-url: http://127.0.0.1:20100
      # 通道传输 AES 密钥（强制常开）
      transport-encrypt:
        key: 0123456789abcdef0123456789abcdef
    # 子应用2: 其他支付通道
    two:
      base-url: http://127.0.0.1:20200
      # 须与子应用一致
      transport-encrypt:
        key: fedcba9876543210fedcba9876543210
    # 子应用3: 国际支付通道(Stripe 等, dax-pay-channel-three 服务)
    three:
      base-url: http://127.0.0.1:20300
      # 须与子应用一致(dev 复用 channel-two key, 生产须独立注入)
      transport-encrypt:
        key: fedcba9876543210fedcba9876543210