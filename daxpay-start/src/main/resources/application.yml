server:
  port: 9999
spring:
  application:
    name: dax-pay-open
  profiles:
    active: dev
  task:
    scheduling:
      pool:
        size: 8
  servlet:
    multipart:
      # 上传文件大小限制为100M
      max-file-size: 100MB
# 监控端点与链路追踪(actuator 配置必须放在顶层, 不能放在 spring: 下)
management:
  # 链路追踪配置(仅日志关联, 不导出到后端; 采样率 dev/prod 共享 1.0 全采样)
  tracing:
    sampling:
      probability: 1.0
    # OTLP 导出开关(关闭后不向 OTLP 后端推送 trace)
    export:
      otlp:
        enabled: false
  # 指标导出配置(仅本地日志关联, 不导出到 OTLP 后端)
  otlp:
    metrics:
      export:
        enabled: false
# ORM
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  global-config:
    banner: false
    db-config:
      # PG逻辑删除需要指定为布尔值, 如果为0/1会出现查询类型错误
      logic-delete-value: true
      logic-not-delete-value: false
mybatis-plus-join:
  banner: false
# 安全框架
sa-token:
  # token 名称(同时是 cookie/请求头名), 前端据此读写, 不可变更
  token-name: Accesstoken
  # token 有效期兜底(秒), 仅在会话管理未启用时生效; 启用后以数据库配置 maxOnlineHours 为准
  timeout: 259200
  is-log: false
  is-print: false
