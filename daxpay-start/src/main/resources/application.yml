server:
  port: 9999
spring:
  application:
    name: dax-pay-open
  profiles:
    active: dev
  task:
    scheduling:
      pool:
        size: 8
  servlet:
    multipart:
      # 上传文件大小限制为100M
      max-file-size: 100MB
# 监控端点与链路追踪(actuator 配置必须放在顶层, 不能放在 spring: 下)
management:
  endpoints:
    web:
      exposure:
        include: health,info,httpexchanges
  endpoint:
    health:
      show-details: always
  # 链路追踪配置(仅日志关联, 不导出到后端)
  tracing:
    sampling:
      probability: 1.0
    # OTLP 导出开关(关闭后不向 OTLP 后端推送 trace)
    # 注意: Spring Boot 4.1 中 enabled 标准键是 management.tracing.export.otlp.enabled,
    # 与 endpoint/transport/headers 等连接细节(management.opentelemetry.tracing.export.otlp.*)分属不同前缀;
    # 旧写法 management.opentelemetry.tracing.export.otlp.enabled 从未存在, 写了不生效。
    export:
      otlp:
        enabled: false
  # 指标导出配置(仅本地日志关联, 不导出到 OTLP 后端)
  otlp:
    metrics:
      export:
        enabled: false
# ORM
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  global-config:
    banner: false
    db-config:
      # PG逻辑删除需要指定为布尔值, 如果为0/1会出现查询类型错误
      logic-delete-value: true
      logic-not-delete-value: false
mybatis-plus-join:
  banner: false
# 安全框架
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Accesstoken
  # token 有效期（单位：秒） 默认72小时，-1 代表永久有效
  timeout: 259200
  # token 最低活跃频率（单位：秒） 默认24小时，-1 代表永久有效
  active-timeout: -1
  #  是否允许同一账号多地同时登
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: true
  is-log: false
  is-print: false
# 字段翻译插件
easy-trans:
  #启用平铺模式
  is-enable-tile: true

