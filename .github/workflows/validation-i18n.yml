name: validation-i18n

on:
  push:
    paths:
      - '**/*.java'
      - 'scripts/check-validation-i18n.mjs'
      - '.github/workflows/validation-i18n.yml'
  pull_request:
    paths:
      - '**/*.java'
      - 'scripts/check-validation-i18n.mjs'
      - '.github/workflows/validation-i18n.yml'

jobs:
  validation-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Bean Validation i18n messages
        run: node scripts/check-validation-i18n.mjs
